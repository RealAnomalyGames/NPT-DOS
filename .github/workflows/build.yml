
name: NPT-DOS 1.0

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Validate NPT-DOS Installer
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-multilib \
            grub-pc-bin \
            grub-common \
            xorriso \
            mtools \
            nasm \
            binutils \
            file \
            qemu-system-x86

      - name: Build ISO and installer assets
        run: make

      - name: Validate both Multiboot kernels
        run: make check

      - name: Validate installer assets
        run: make check-installer-assets

      - name: Verify exact binary sizes
        shell: bash
        run: |
          set -euo pipefail

          test "$(wc -c < build/installer_boot.bin)" -eq 512
          test "$(wc -c < build/second_stage.bin)" -eq 8192
          test "$(wc -c < build/installed_kernel.bin)" -eq 131072

          echo "Installer boot sector: 512 bytes"
          echo "Second-stage loader: 8192 bytes"
          echo "Installed kernel image: 131072 bytes"

      - name: Verify BIOS boot signature
        shell: bash
        run: |
          set -euo pipefail

          SIGNATURE="$(od -An -tx1 -j510 -N2 build/installer_boot.bin | tr -d ' \n')"

          if [ "$SIGNATURE" != "55aa" ]; then
            echo "ERROR: Invalid BIOS boot signature: $SIGNATURE"
            exit 1
          fi

          echo "BIOS boot signature verified: 55 AA"

      - name: Verify installer assets are embedded
        shell: bash
        run: |
          set -euo pipefail

          nm build/kernel.elf | grep -q 'installer_boot_start'
          nm build/kernel.elf | grep -q 'installer_boot_end'
          nm build/kernel.elf | grep -q 'installer_stage2_start'
          nm build/kernel.elf | grep -q 'installer_stage2_end'
          nm build/kernel.elf | grep -q 'installer_kernel_start'
          nm build/kernel.elf | grep -q 'installer_kernel_end'

          echo "All expected installer asset symbols are present."

      - name: Verify installer layout and embedded assets
        run: python3 scripts/verify_installer.py

      - name: Create disposable BIOS boot-test disk
        shell: bash
        run: |
          set -euo pipefail

          truncate -s 16M build/installer-smoke.img

          dd if=build/installer_boot.bin \
            of=build/installer-smoke.img \
            bs=512 seek=0 conv=notrunc status=none

          dd if=build/second_stage.bin \
            of=build/installer-smoke.img \
            bs=512 seek=32 conv=notrunc status=none

          dd if=build/installed_kernel.bin \
            of=build/installer-smoke.img \
            bs=512 seek=64 conv=notrunc status=none

          echo "Created a disposable 16 MiB boot-test disk."
          echo "No physical disk or user data is accessed."

      - name: Boot-test BIOS chain with QEMU
        shell: bash
        run: |
          set -euo pipefail

          rm -f build/boot-chain.log

          set +e
          timeout 10s qemu-system-i386 \
            -machine pc \
            -accel tcg \
            -m 64M \
            -drive file=build/installer-smoke.img,format=raw,if=ide \
            -boot order=c \
            -display none \
            -serial none \
            -monitor none \
            -no-reboot \
            -no-shutdown \
            -debugcon file:build/boot-chain.log \
            -global isa-debugcon.iobase=0xe9
          qemu_status=$?
          set -e

          if [ "$qemu_status" -ne 124 ] && [ "$qemu_status" -ne 0 ]; then
            echo "QEMU exited unexpectedly: $qemu_status"
            cat build/boot-chain.log || true
            exit 1
          fi

          echo "QEMU diagnostic output:"
          cat build/boot-chain.log

          if ! grep -q '123K' build/boot-chain.log; then
            echo "ERROR: The complete BIOS-to-kernel boot chain was not verified."
            exit 1
          fi

          echo "PASS: BIOS boot sector, second stage, protected mode, and kernel entry verified."

      - name: Verify bootable ISO exists
        shell: bash
        run: |
          set -euo pipefail

          test -s build/npt-dos-1.0.iso
          file build/npt-dos-1.0.iso
          ls -lh build/npt-dos-1.0.iso

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail

          sha256sum \
            build/npt-dos-1.0.iso \
            build/kernel-base.elf \
            build/kernel.elf \
            build/installer_boot.bin \
            build/second_stage.bin \
            build/installed_kernel.bin \
            > build/SHA256SUMS

          cat build/SHA256SUMS

      - name: Attest NPT-DOS ISO provenance
        uses: actions/attest@v4
        with:
          subject-path: build/npt-dos-1.0.iso

      - name: Upload validated NPT-DOS ISO
        uses: actions/upload-artifact@v4
        with:
          name: npt-dos-1.0-iso
          if-no-files-found: error
          path: |
            build/npt-dos-1.0.iso
            build/SHA256SUMS
