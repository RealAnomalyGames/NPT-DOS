name: NPT-DOS Build 014

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Validate NPT-DOS ISO
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-multilib \
            grub-pc-bin \
            grub-common \
            xorriso \
            mtools \
            nasm

      - name: Compile kernel and create ISO
        run: make

      - name: Build hard-disk installation assets
        run: make installer-assets

      - name: Validate installation asset sizes
        run: make check-installer-assets

      - name: Upload installation assets
        uses: actions/upload-artifact@v4
        with:
          name: npt-dos-build-014-e-installation-assets
          path: |
            build/installer_boot.bin
            build/second_stage.bin
            build/installed_kernel.bin
            build/installer_boot.bin.sha256
          if-no-files-found: error

      - name: Validate Multiboot kernel
        run: make check

      - name: Verify ISO exists
        run: |
          test -s build/npt-dos-build-014.iso
          file build/npt-dos-build-014.iso
          ls -lh build/npt-dos-build-014.iso

      - name: Generate ISO SHA-256 checksum
        run: |
          sha256sum build/npt-dos-build-014.iso > build/npt-dos-build-014.iso.sha256
          cat build/npt-dos-build-014.iso.sha256

      - name: Generate installation asset checksums
        run: |
          sha256sum \
            build/installer_boot.bin \
            build/second_stage.bin \
            build/installed_kernel.bin \
            > build/installation-assets.sha256

      - name: Upload bootable ISO
        uses: actions/upload-artifact@v4
        with:
          name: npt-dos-build-014
          path: |
            build/npt-dos-build-014.iso
            build/npt-dos-build-014.iso.sha256
            build/installation-assets.sha256
