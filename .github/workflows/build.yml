name: NPT-DOS Build 008

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Validate NPT-DOS ISO
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-multilib \
            grub-pc-bin \
            grub-common \
            xorriso \
            mtools \
            nasm

      - name: Compile kernel and create ISO
        run: make

      - name: Validate Multiboot kernel
        run: make check

      - name: Verify ISO exists
        run: |
          test -s build/npt-dos-build-008.iso
          file build/npt-dos-build-008.iso
          ls -lh build/npt-dos-build-008.iso

      - name: Generate ISO SHA-256 checksum
        run: |
          sha256sum build/npt-dos-build-008.iso > build/npt-dos-build-008.iso.sha256
          cat build/npt-dos-build-008.iso.sha256

      - name: Upload bootable ISO
        uses: actions/upload-artifact@v4
        with:
          name: npt-dos-build-007
          path: |
            build/npt-dos-build-008.iso
            build/npt-dos-build-008.iso.sha256
