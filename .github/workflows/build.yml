name: NPT-DOS Build 003

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Validate NPT-DOS ISO
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-multilib \
            grub-pc-bin \
            grub-common \
            xorriso \
            mtools \
            nasm

      - name: Compile kernel and create ISO
        run: make

      - name: Validate Multiboot kernel
        run: make check

      - name: Verify ISO exists
        run: |
          test -s build/npt-dos-build-003.iso
          file build/npt-dos-build-003.iso
          ls -lh build/npt-dos-build-003.iso

      - name: Upload bootable ISO
        uses: actions/upload-artifact@v4
        with:
          name: npt-dos-build-003
          path: build/npt-dos-build-003.iso
          if-no-files-found: error
          retention-days: 14
